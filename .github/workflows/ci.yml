# Builds every plugin against DevHub's latest Sdk, and checks the packages for known vulnerabilities.
# Runs on pull requests, inside publish.yml (so a push to main runs it once), and on demand.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: DevHub Sdk
        shell: pwsh
        run: pwsh build/Get-Sdk.ps1

      - name: Build every plugin (warnings are errors)
        shell: pwsh
        run: |
          foreach ($project in Get-ChildItem plugins -Filter *.csproj -Recurse -Depth 1) {
            dotnet build $project.FullName -c Release -warnaserror
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $($project.Name)" }
          }

      - name: Vulnerable packages
        shell: pwsh
        run: |
          foreach ($project in Get-ChildItem plugins -Filter *.csproj -Recurse -Depth 1) {
            $report = dotnet list $project.FullName package --vulnerable --include-transitive 2>&1 | Out-String
            Write-Output $report
            if ($report -match "has the following vulnerable packages") { throw "Vulnerable packages in $($project.Name)" }
          }

  dependency-review:
    # Needs a public repository (or GitHub Advanced Security): skipped while the repo is private.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
