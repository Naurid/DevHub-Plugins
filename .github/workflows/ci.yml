# Builds every plugin against DevHub's latest Sdk (NuGet), runs the tests, and checks the packages for known vulnerabilities.
# Runs on pull requests, inside publish.yml (so a push to main runs it once), and on demand.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (warnings are errors)
        run: dotnet build DevHub-Plugins.sln -c Release -warnaserror

      # Windows on purpose: the tests run real git / dotnet / cargo / go (each skipped when it isn't installed).
      - name: Test
        run: dotnet test DevHub-Plugins.sln --no-build -c Release --logger trx --results-directory test-results

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list DevHub-Plugins.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $report
          if ($report -match "has the following vulnerable packages") { throw "Vulnerable packages" }

  dependency-review:
    # Needs a public repository (or GitHub Advanced Security): skipped while the repo is private.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
